name: Android build

# Pull requests are the unit of work, so they are what gets built and tested. A push to main is
# built once more so the newest APK is always downloadable from the latest main run.
# Changes that touch only documentation do not build the app: nothing in them reaches the APK.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch replaces an older one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric downloads its Android jars from Maven Central into ~/.m2. Caching them stops
      # runs from hitting Maven Central's HTTP 429 rate limit when several pull requests build at once.
      - name: Cache Robolectric Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-jars-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-jars-${{ runner.os }}-
      # The same run renders the screens and writes the screenshots that UI review needs.
      - name: Unit tests and screenshots
        run: ./gradlew testDebugUnitTest -PrecordScreenshots
      - name: Require every screenshot
        run: |
          expected=258
          actual=$(ls app/build/outputs/screenshots/*.png 2>/dev/null | wc -l)
          echo "screenshots: $actual of $expected"
          test "$actual" -eq "$expected"
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/screenshots/
          if-no-files-found: error
          retention-days: 3
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 3
      - name: Build debug APK
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short_sha=$(printf '%s' "$HEAD_SHA" | cut -c1-7)
          if [ -n "$PR_NUMBER" ]; then
            stamp="PR #${PR_NUMBER} @ ${short_sha}"
          else
            stamp="main @ ${short_sha}"
          fi
          ./gradlew assembleDebug -PbuildStamp="$stamp"
      - uses: actions/upload-artifact@v4
        with:
          name: drivelift-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
